              }
            ]
          },
          "instructions": {
            "text_instructions": [
              {
                "content": [
                  "## Output\n",
                  "- Return only the measures the question asks for, plus the columns it groups by. Do not add counts or other extra columns unless asked.\n",
                  "- Do not add `IS NOT NULL` filters unless the question asks for them. Aggregates such as AVG and SUM already skip NULLs, and a NULL filter on one column changes every other measure in the query."
                ],
                "id": "01f1c2fb9f831f5bbb8b5c13f02b8165"
              }
            ]
          },
          "version": 2
        }
